name: "Build emu (Linux)"

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (empty = latest on branch)'
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (leave empty for latest on branch)'
        type: string
        default: ''

permissions:
  contents: "write"

env:
  PREMAKE_ACTION: "gmake"
  DEPS_CACHE_KEY: "emu-deps-linux"
  DEPS_CACHE_DIR: "build/deps/linux"

  PACKAGE_BASE_DIR: "build/package/linux"
  THIRD_PARTY_BASE_DIR: "third-party"

  # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
  MAX_PARALLEL_JOBS: 4

jobs:
  deps:
    name: "Restore or build deps"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-deps-linux.yml"
    with:
      branch: ${{ inputs.branch || 'dev' }}
      commit: ${{ inputs.commit || '' }}

  builds-matrix-linux:
    name: "build"
    needs: ["deps"]
    runs-on: "ubuntu-24.04"
    if: ${{ !cancelled() }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        prj: [
            # regular api
            "api_regular",
            "steamclient_regular",
            # api + client (experimental)
            "api_experimental",
            "steamclient_experimental",
            # tools
            "tool_lobby_connect",
            "tool_generate_interfaces",
            # tests
            "test_gamepad_linux",
          ]
        arch: ["x64", "x86"]
        cfg: ["debug", "release"]

    steps:
      # clone branch
      - name: "Checkout branch"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Capture build commit SHA"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT






      # deps
      - name: "Restore deps"
        id: "emu-deps-cache-step"
        uses: actions/cache@v5
        with:
          key: "${{ env.DEPS_CACHE_KEY }}-${{ env.PREMAKE_ACTION }}"
          path: "${{ env.DEPS_CACHE_DIR }}/${{ env.PREMAKE_ACTION }}"

      # extra helpers/tools, these are not built inside the deps build dir
      - name: "Clone third-party build helpers (common/linux)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/common/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/common/linux"

      - name: "Clone third-party build helpers (build/linux)"
        uses: actions/checkout@v6
        with:
          ref: "third-party/build/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/build/linux"

      # fix folder permissions! not sure why this fails
      # nested subdirs "build/linux/release" cause permission problems
      - name: "Give all permissions to repo folder"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: sudo chmod -R 777 "${{ github.workspace }}"

      # mandatory Linux packages
      - name: "Install required packages"
        shell: "bash"
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -y
          sudo apt install -y coreutils # echo, printf, etc...
          sudo apt install -y build-essential
          sudo apt install -y gcc-multilib # needed for 32-bit builds
          sudo apt install -y g++-multilib
          # sudo apt install -y clang
          sudo apt install -y libglx-dev # needed for overlay build (header files such as GL/glx.h)
          sudo apt install -y libgl-dev # needed for overlay build (header files such as GL/gl.h)
          sudo apt install -y libx11-dev:i386 # needed for overlay build
          # sudo apt install -y binutils # (optional) contains the tool 'readelf' mainly, and other usefull binary stuff

      # generate project files
      - name: "Set build date"
        shell: "bash"
        run: echo "EMU_BUILD_DATE=$(date +%Y_%m_%d)" >> $GITHUB_ENV

      - name: "Generate project files"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo chmod 777 ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5
          ./${{env.THIRD_PARTY_BASE_DIR}}/common/linux/premake/premake5 --file=premake5.lua --genproto --emubuild=${{ steps.build_ref.outputs.sha }} --emubuilddate=${{ env.EMU_BUILD_DATE }} --os=linux gmake

      # build target
      - name: "Build target"
        shell: "bash"
        working-directory: "${{ github.workspace }}/build/project/gmake/linux"
        run: |
          echo "dry run..."
          make -n -j ${{ env.MAX_PARALLEL_JOBS }} config=${{ matrix.cfg }}_${{ matrix.arch }} ${{ matrix.prj }}
          echo "actual run..."
          make -j ${{ env.MAX_PARALLEL_JOBS }} config=${{ matrix.cfg }}_${{ matrix.arch }} ${{ matrix.prj }}

      # upload artifact/package to github Actions
      - name: "Upload target package"
        uses: actions/upload-artifact@v7
        with:
          name: "emu-linux-${{ matrix.prj }}-${{ matrix.cfg }}-${{ matrix.arch }}-${{ steps.build_ref.outputs.sha }}"
          path: "build/linux"
          if-no-files-found: "error"
          compression-level: 9
          retention-days: 1
          overwrite: true