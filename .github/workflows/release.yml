name: "Prepare release"

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        type: string
        default: 'dev'
      commit:
        description: 'Commit SHA to build (leave empty for latest on branch)'
        type: string
        default: ''
      rebuild_ssq:
        description: 'Force rebuild ssq (ignore cache)'
        type: boolean
        default: false
      rebuild_zlib:
        description: 'Force rebuild zlib (ignore cache)'
        type: boolean
        default: false
      rebuild_mbedtls:
        description: 'Force rebuild mbedtls (ignore cache)'
        type: boolean
        default: false
      rebuild_curl:
        description: 'Force rebuild curl (ignore cache)'
        type: boolean
        default: false
      rebuild_protobuf:
        description: 'Force rebuild protobuf (ignore cache)'
        type: boolean
        default: false
      rebuild_ingame_overlay:
        description: 'Force rebuild ingame_overlay (ignore cache)'
        type: boolean
        default: false
      rebuild_opus:
        description: 'Force rebuild opus (ignore cache)'
        type: boolean
        default: false
      rebuild_portaudio:
        description: 'Force rebuild portaudio (ignore cache)'
        type: boolean
        default: false
      rebuild_sdl:
        description: 'Force rebuild sdl (ignore cache)'
        type: boolean
        default: false

permissions:
  contents: "write"
  actions: "write"

env:
  THIRD_PARTY_BASE_DIR: "third-party"

jobs:
  emu-win-all:
    name: "Build all Windows targets"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-build-all-win.yml"
    with:
      branch: ${{ inputs.branch || 'dev' }}
      commit: ${{ inputs.commit || '' }}
      rebuild_ssq: ${{ inputs.rebuild_ssq || false }}
      rebuild_zlib: ${{ inputs.rebuild_zlib || false }}
      rebuild_mbedtls: ${{ inputs.rebuild_mbedtls || false }}
      rebuild_curl: ${{ inputs.rebuild_curl || false }}
      rebuild_protobuf: ${{ inputs.rebuild_protobuf || false }}
      rebuild_ingame_overlay: ${{ inputs.rebuild_ingame_overlay || false }}
      rebuild_opus: ${{ inputs.rebuild_opus || false }}
      rebuild_portaudio: ${{ inputs.rebuild_portaudio || false }}
      rebuild_sdl: ${{ inputs.rebuild_sdl || false }}

  emu-win-prep:
    name: "Package and publish Windows release"
    needs: ["emu-win-all"]
    runs-on: "windows-2025-vs2026"
    steps:
      - name: "Checkout repository (branch/commit with packaging scripts)"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Resolve exact commit SHA being packaged"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      # Windows Git auto-converts line endings to CRLF — force LF to keep scripts consistent
      - name: "Disable Git automatic CRLF line ending conversion"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          git config --local core.autocrlf false
          git config --system core.autocrlf false
          git config --global core.autocrlf false

      - name: "Checkout Windows third-party dependencies"
        uses: actions/checkout@v6
        with:
          ref: "third-party/deps/win"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/win"

      - name: "Download Windows build artifacts from previous jobs"
        uses: actions/download-artifact@v8
        with:
          path: "build/win"
          pattern: "emu-win-*-${{ steps.build_ref.outputs.sha }}"
          merge-multiple: true

      - name: "List downloaded build files"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: |
          dir /s /b /a:-d build\win

      - name: "Package Windows build — Release configuration"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2026\release

      - name: "Package Windows build — Debug configuration"
        shell: "cmd"
        working-directory: "${{ github.workspace }}"
        run: package_win.bat vs2026\debug 1

      # Publish directly to the GitHub Release when triggered by a tag push
      - name: "Publish packages to GitHub Release (tag builds only)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "build/package/win/**/*"

      # On manual runs, upload as workflow artifacts instead of a release
      - name: "Upload Windows release package as workflow artifact (manual runs only)"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-win-release-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/win/vs2026/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: "Upload Windows debug package as workflow artifact (manual runs only)"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-win-debug-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/win/vs2026/*debug*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: "Clean up intermediate Windows build artifacts"
        uses: actions/delete-artifact@v5
        with:
          pattern: "emu-win-*-${{ steps.build_ref.outputs.sha }}"

  emu-linux-all:
    name: "Build all Linux targets"
    if: ${{ !cancelled() }}
    uses: "./.github/workflows/emu-build-all-linux.yml"
    with:
      branch: ${{ inputs.branch || 'dev' }}
      commit: ${{ inputs.commit || '' }}
      rebuild_ssq: ${{ inputs.rebuild_ssq || false }}
      rebuild_zlib: ${{ inputs.rebuild_zlib || false }}
      rebuild_mbedtls: ${{ inputs.rebuild_mbedtls || false }}
      rebuild_curl: ${{ inputs.rebuild_curl || false }}
      rebuild_protobuf: ${{ inputs.rebuild_protobuf || false }}
      rebuild_ingame_overlay: ${{ inputs.rebuild_ingame_overlay || false }}
      rebuild_opus: ${{ inputs.rebuild_opus || false }}
      rebuild_portaudio: ${{ inputs.rebuild_portaudio || false }}
      rebuild_sdl: ${{ inputs.rebuild_sdl || false }}

  emu-linux-prep:
    name: "Package and publish Linux release"
    needs: ["emu-linux-all"]
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Checkout repository (branch/commit with packaging scripts)"
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit || inputs.branch || 'dev' }}

      - name: "Resolve exact commit SHA being packaged"
        id: "build_ref"
        shell: "bash"
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: "Checkout Linux third-party dependencies"
        uses: actions/checkout@v6
        with:
          ref: "third-party/deps/linux"
          path: "${{env.THIRD_PARTY_BASE_DIR}}/deps/linux"

      - name: "Download Linux build artifacts from previous jobs"
        uses: actions/download-artifact@v8
        with:
          path: "build/linux"
          pattern: "emu-linux-*-${{ steps.build_ref.outputs.sha }}"
          merge-multiple: true

      # Nested subdirectories under build/linux can have permission issues — fix them upfront
      - name: "Fix workspace and packaging script permissions"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: sudo chmod -R 777 "${{ github.workspace }}" && sudo chmod 777 package_linux.sh

      - name: "List downloaded build files"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          ls -la build/linux/*/*

      - name: "Install required system packages (tar)"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: |
          sudo apt update || exit 1
          sudo apt install tar -y || exit 1

      - name: "Package Linux build — Release configuration"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: ./package_linux.sh gmake/release

      - name: "Package Linux build — Debug configuration"
        shell: "bash"
        working-directory: "${{ github.workspace }}"
        run: ./package_linux.sh gmake/debug 1

      # Publish directly to the GitHub Release when triggered by a tag push
      - name: "Publish packages to GitHub Release (tag builds only)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: "build/package/linux/**/*"

      # On manual runs, upload as workflow artifacts instead of a release
      - name: "Upload Linux release package as workflow artifact (manual runs only)"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-linux-release-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/linux/gmake/*release*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: "Upload Linux debug package as workflow artifact (manual runs only)"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: "release-emu-linux-debug-${{ steps.build_ref.outputs.sha }}"
          path: "build/package/linux/gmake/*debug*"
          if-no-files-found: "error"
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: "Clean up intermediate Linux build artifacts"
        uses: actions/delete-artifact@v5
        with:
          pattern: "emu-linux-*-${{ steps.build_ref.outputs.sha }}"
